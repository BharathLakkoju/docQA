# Render Blueprint for the FastAPI backend. Deploy via Render's "New +" ->
# "Blueprint" and pointing it at this repo, or apply manually as a Docker
# web service with these same settings. See DEPLOYMENT.md for the full
# walkthrough, including which env vars must be filled in by hand (secrets
# are never stored here).
services:
  - type: web
    name: workflowgpt-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_CLOUD
        value: aws
      - key: PINECONE_REGION
        value: us-east-1
      - key: PINECONE_INDEX_CONFIGS
        value: workflowgpt-configs
      - key: PINECONE_INDEX_PROSE
        value: workflowgpt-prose
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: google/gemma-4-26b-a4b-it:free
      - key: OPENROUTER_API_KEY
        sync: false
      # Set to the deployed Vercel frontend URL once that's live (e.g.
      # https://workflowgpt.vercel.app) -- comma-separated if there's more
      # than one (production + preview).
      - key: CORS_ORIGINS
        sync: false
